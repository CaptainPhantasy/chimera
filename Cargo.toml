[workspace]
resolver = "2"
members = [
    "crates/chimera-cli",
    "crates/chimera-core",
    "crates/chimera-config",
    "crates/chimera-llm",
    "crates/chimera-session",
    "crates/chimera-creatures",
    "crates/chimera-tools",
    "crates/chimera-trace",
    "crates/chimera-shell",
    "crates/chimera-sandbox",
    "crates/chimera-browser",
    "crates/chimera-tui",
    "crates/chimera-mobile",
    "crates/chimera-comms",
    "crates/chimera-memory",
    "crates/chimera-eval",
    "crates/chimera-mcp",
    "crates/chimera-api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
crossterm = "0.28"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
tokio-stream = "0.1"
ignore = "0.4"
globset = "0.4"
regex = "1"

# Internal crates
chimera-core = { path = "crates/chimera-core" }
chimera-llm = { path = "crates/chimera-llm" }
chimera-config = { path = "crates/chimera-config" }
chimera-session = { path = "crates/chimera-session" }
chimera-creatures = { path = "crates/chimera-creatures" }
chimera-tools = { path = "crates/chimera-tools" }
chimera-trace = { path = "crates/chimera-trace" }
chimera-shell = { path = "crates/chimera-shell" }
chimera-sandbox = { path = "crates/chimera-sandbox" }
chimera-browser = { path = "crates/chimera-browser" }
chimera-tui = { path = "crates/chimera-tui" }
chimera-mobile = { path = "crates/chimera-mobile" }
chimera-comms = { path = "crates/chimera-comms" }
chimera-memory = { path = "crates/chimera-memory" }
chimera-eval = { path = "crates/chimera-eval" }
chimera-mcp = { path = "crates/chimera-mcp" }
chimera-api = { path = "crates/chimera-api" }
